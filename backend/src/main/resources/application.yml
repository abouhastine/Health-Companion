spring:
  application.name: health-companion-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/health_companion}
    username: ${DATABASE_USERNAME:health_companion}
    password: ${DATABASE_PASSWORD:health_companion}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet.multipart:
    max-file-size: ${MAX_DOCUMENT_SIZE:10MB}
    max-request-size: ${MAX_DOCUMENT_SIZE:10MB}
  mvc.problemdetails.enabled: true
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
springdoc:
  swagger-ui.path: /swagger-ui.html
  show-actuator: false
app:
  jwt.secret: ${JWT_SECRET:change-this-demo-secret-to-at-least-32-characters}
  jwt.expiration-minutes: 480
  mobile-session.access-expiration-minutes: ${MOBILE_ACCESS_EXPIRATION_MINUTES:15}
  mobile-session.refresh-expiration-days: ${MOBILE_REFRESH_EXPIRATION_DAYS:30}
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  storage.minio.endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  storage.minio.access-key: ${MINIO_ACCESS_KEY:minioadmin}
  storage.minio.secret-key: ${MINIO_SECRET_KEY:minioadmin}
  storage.minio.bucket: ${MINIO_BUCKET:health-documents}
  ai:
    chat-provider: ${AI_CHAT_PROVIDER:none}
    embedding-provider: ${AI_EMBEDDING_PROVIDER:none}
    top-k: ${AI_TOP_K:4}
    request-timeout: ${AI_REQUEST_TIMEOUT:120s}
