databaseChangeLog:
  - changeSet:
      id: provider-aware-embedding-dimensions
      author: codex
      preConditions:
        - onFail: HALT
        - dbms:
            type: postgresql
      changes:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE document_chunks
                ALTER COLUMN embedding TYPE vector USING embedding::vector;
              ALTER TABLE knowledge_chunks
                ALTER COLUMN embedding TYPE vector USING embedding::vector;

              ALTER TABLE document_chunks
                ADD COLUMN embedding_dimension INTEGER;
              ALTER TABLE knowledge_chunks
                ADD COLUMN embedding_dimension INTEGER;

              UPDATE document_chunks
                SET embedding_dimension = vector_dims(embedding)
                WHERE embedding IS NOT NULL;
              UPDATE knowledge_chunks
                SET embedding_dimension = vector_dims(embedding)
                WHERE embedding IS NOT NULL;

              ALTER TABLE document_chunks
                ADD CONSTRAINT chk_document_chunks_embedding_dimension
                CHECK (embedding IS NULL OR embedding_dimension = vector_dims(embedding));
              ALTER TABLE knowledge_chunks
                ADD CONSTRAINT chk_knowledge_chunks_embedding_dimension
                CHECK (embedding IS NULL OR embedding_dimension = vector_dims(embedding));

              CREATE INDEX idx_document_chunks_embedding_profile_dimension
                ON document_chunks (document_id, embedding_profile, embedding_dimension);
              CREATE INDEX idx_knowledge_chunks_embedding_profile_dimension
                ON knowledge_chunks (embedding_profile, embedding_dimension);
