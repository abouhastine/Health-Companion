databaseChangeLog:
  - changeSet:
      id: initial-schema
      author: codex
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE EXTENSION IF NOT EXISTS vector;
              CREATE TABLE users (id BIGSERIAL PRIMARY KEY, first_name VARCHAR(100) NOT NULL, last_name VARCHAR(100) NOT NULL, email VARCHAR(255) NOT NULL UNIQUE, phone VARCHAR(50), password_hash VARCHAR(255) NOT NULL, role VARCHAR(20) NOT NULL, created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP);
              CREATE TABLE practitioners (id BIGSERIAL PRIMARY KEY, first_name VARCHAR(100) NOT NULL, last_name VARCHAR(100) NOT NULL, specialty VARCHAR(150) NOT NULL, organization VARCHAR(200) NOT NULL, address VARCHAR(300), languages VARCHAR(300));
              CREATE TABLE appointment_slots (id BIGSERIAL PRIMARY KEY, practitioner_id BIGINT NOT NULL REFERENCES practitioners(id), start_at TIMESTAMP NOT NULL, end_at TIMESTAMP NOT NULL, available BOOLEAN NOT NULL DEFAULT TRUE);
              CREATE TABLE appointments (id BIGSERIAL PRIMARY KEY, patient_id BIGINT NOT NULL REFERENCES users(id), practitioner_id BIGINT NOT NULL REFERENCES practitioners(id), appointment_slot_id BIGINT NOT NULL UNIQUE REFERENCES appointment_slots(id), reason VARCHAR(1000), status VARCHAR(20) NOT NULL, created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP);
              CREATE TABLE medical_documents (id BIGSERIAL PRIMARY KEY, patient_id BIGINT NOT NULL REFERENCES users(id), practitioner_id BIGINT REFERENCES practitioners(id), title VARCHAR(255) NOT NULL, document_type VARCHAR(30) NOT NULL, document_date DATE NOT NULL, storage_path VARCHAR(500) NOT NULL, mime_type VARCHAR(100) NOT NULL, created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP);
              CREATE TABLE document_chunks (id BIGSERIAL PRIMARY KEY, document_id BIGINT NOT NULL REFERENCES medical_documents(id) ON DELETE CASCADE, chunk_index INT NOT NULL, page INT, content TEXT NOT NULL, embedding vector(768), embedding_profile VARCHAR(100), rag_scope VARCHAR(30) NOT NULL DEFAULT 'PATIENT_DOCUMENT');
              CREATE TABLE knowledge_chunks (id BIGSERIAL PRIMARY KEY, source VARCHAR(255) NOT NULL, topic VARCHAR(255), language VARCHAR(10), version VARCHAR(50), chunk_index INT NOT NULL, content TEXT NOT NULL, embedding vector(768), embedding_profile VARCHAR(100), rag_scope VARCHAR(30) NOT NULL DEFAULT 'MEDICAL_KNOWLEDGE');
              CREATE TABLE ai_conversations (id BIGSERIAL PRIMARY KEY, patient_id BIGINT NOT NULL REFERENCES users(id), document_id BIGINT REFERENCES medical_documents(id), created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP);
              CREATE TABLE ai_messages (id BIGSERIAL PRIMARY KEY, conversation_id BIGINT NOT NULL REFERENCES ai_conversations(id) ON DELETE CASCADE, role VARCHAR(20) NOT NULL, content TEXT NOT NULL, mode VARCHAR(30), created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP);
              CREATE TABLE ai_audit_events (id BIGSERIAL PRIMARY KEY, patient_id BIGINT NOT NULL REFERENCES users(id), conversation_id BIGINT REFERENCES ai_conversations(id), mode VARCHAR(30), provider VARCHAR(50), safety_blocked BOOLEAN NOT NULL DEFAULT FALSE, created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP);
